name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'   # nightly, for ssh-integration against the current runner image
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            CHANGELOG.md
            docs/*.md

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, posix
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  phar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build on PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: scripts/build.sh
      - name: Run the phar on PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
          coverage: none
      - name: Smoke test
        run: |
          php dist/cpdeploy.phar --version
          mkdir -p "$RUNNER_TEMP/fakebin"
          printf '#!/bin/sh\necho "{\\"result\\":{\\"status\\":1,\\"data\\":{}}}"\n' > "$RUNNER_TEMP/fakebin/uapi"
          chmod +x "$RUNNER_TEMP/fakebin/uapi"
          set +e
          CPDEPLOY_TESTING=1 CPDEPLOY_HOME="$RUNNER_TEMP/home/cpdeploy" CPDEPLOY_TEST_PATH="$RUNNER_TEMP/fakebin" \
            php dist/cpdeploy.phar check --json > check.json
          code=$?
          set -e
          cat check.json
          php -r '$d = json_decode(file_get_contents("check.json"), true); exit(is_array($d) && ($d["schema"] ?? 0) === 1 ? 0 : 1);'
          test "$code" -eq 0 || test "$code" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: cpdeploy-phar
          path: dist/

  real-laravel:
    # A real laravel/laravel app, real Composer and Node 22, SQLite; fakes only for
    # uapi and the web server. First deploy, then a second with Composer skipped (§16.6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pcntl, posix, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --no-progress
      - name: Create a laravel/laravel app
        run: |
          composer create-project laravel/laravel "$RUNNER_TEMP/laravel-app" --no-interaction --no-progress --prefer-dist
          cd "$RUNNER_TEMP/laravel-app"
          npm install --package-lock-only --no-audit --no-fund
      - run: vendor/bin/phpunit --testsuite RealLaravel --fail-on-skipped
        env:
          CPDEPLOY_REAL_LARAVEL_APP: ${{ runner.temp }}/laravel-app

  ssh-integration:
    # A throwaway sshd on 127.0.0.1 accepts only a generated deploy key; git runs
    # through cpdeploy's GIT_SSH_COMMAND and known_hosts (GIT-02, GIT-06, SEC-04).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pcntl, posix
          coverage: none
      - run: sudo apt-get install -y -q openssh-server
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite Integration
        env:
          CPDEPLOY_SSH_INTEGRATION: '1'
