name: Release

# On a version tag (§15.4): the full CI, the phar built on PHP 8.3, and a GitHub
# Release with cpdeploy.phar, cpdeploy.phar.sha256 and install.sh. The notes are
# the tag's section of CHANGELOG.md. Tags with a suffix (v1.2.0-rc.1) are marked
# as pre-releases; self-update ignores them unless --pre.
#
# It can also be run by hand (Actions → Release → Run workflow) with a tag name:
# the tag is then created on the commit that was built, when the release is
# published.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and release, e.g. v1.0.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a version tag like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::The tag $tag already exists; push it to release it, or choose another"
              exit 1
            fi
            # Local only, so build.sh's `git describe` reports the version; the
            # release below creates the tag on GitHub.
            git tag "$tag"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: scripts/build.sh
      - name: Check the phar reports the tag
        run: php dist/cpdeploy.phar --version | grep -F "cpdeploy ${TAG#v} "
      - run: scripts/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" \
            dist/cpdeploy.phar dist/cpdeploy.phar.sha256 dist/install.sh \
            --target "$GITHUB_SHA" \
            --title "cpdeploy ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${pre[@]}"
