name: Release

# On a version tag (§15.4): the full CI, the phar built on PHP 8.3, and a GitHub
# Release with cpdeploy.phar, cpdeploy.phar.sha256 and install.sh. The notes are
# the tag's section of CHANGELOG.md. Tags with a suffix (v1.2.0-rc.1) are marked
# as pre-releases; self-update ignores them unless --pre.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: scripts/build.sh
      - name: Check the phar reports the tag
        run: php dist/cpdeploy.phar --version | grep -F "cpdeploy ${GITHUB_REF_NAME#v} "
      - run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            dist/cpdeploy.phar dist/cpdeploy.phar.sha256 dist/install.sh \
            --title "cpdeploy ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${pre[@]}"
